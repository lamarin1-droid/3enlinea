<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego 3 en raya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container text-center mt-3">
        <h1 class="fs-2">Juego 3 en linea</h1>

        <div>
            <label>
                <img src="img/x.jpg" alt="x" width="50" height="60">
            </label>
            <input type="text" class="nombre" id="jugador1" required placeholder="ejem.. luis">
        </div>

        <div>
            <label>
                <img src="img/o.jpg" alt="o" width="50" height="60">
            </label>
            <input type="text" class="nombre" id="jugador2" required placeholder="ejem.. juan">
        </div>

        <br>
        <button class="testbtn btn btn-primary" onclick="iniciar()">iniciar juego</button>
        <br><br>

        <p id="turnoTexto">Turno:</p>
        <p id="mensaje"></p>

        <table class="table table-bordered text-center">
            <tr>
                <td onclick="jugar(0,0)"><div class="ratio ratio-1x1"><div id="c00" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
                <td onclick="jugar(0,1)"><div class="ratio ratio-1x1"><div id="c01" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
                <td onclick="jugar(0,2)"><div class="ratio ratio-1x1"><div id="c02" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
            </tr>

            <tr>
                <td onclick="jugar(1,0)"><div class="ratio ratio-1x1"><div id="c10" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
                <td onclick="jugar(1,1)"><div class="ratio ratio-1x1"><div id="c11" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
                <td onclick="jugar(1,2)"><div class="ratio ratio-1x1"><div id="c12" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
            </tr>

            <tr>
                <td onclick="jugar(2,0)"><div class="ratio ratio-1x1"><div id="c20" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
                <td onclick="jugar(2,1)"><div class="ratio ratio-1x1"><div id="c21" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
                <td onclick="jugar(2,2)"><div class="ratio ratio-1x1"><div id="c22" class="fs-1 d-flex align-items-center justify-content-center"><img src="img/fondo.jpg" class="img-fluid"></div></div></td>
            </tr>
        </table>
    </div>

    <script>
        var matriz = [
            ["", "", ""],
            ["", "", ""],
            ["", "", ""]
        ];
        var turno = "X";
        var iniciado = false;
        var terminado = false;
        function iniciar() {
            var j1 = document.getElementById("jugador1").value;

            iniciado = true;
            turno = "X";
            document.getElementById("turnoTexto").innerHTML = "turno: " + j1;
        }
        function jugar(fila, col) {
            if (iniciado == false || terminado == true) {
                return;
            }
            if (matriz[fila][col] != "") {
                return;
            }
            var j1 = document.getElementById("jugador1").value;
            var j2 = document.getElementById("jugador2").value;
            var nombreActual = "";
            if (turno == "X") {
                nombreActual = j1;
            } else {
                nombreActual = j2;
            }
            matriz[fila][col] = turno;
            document.getElementById("c" + fila + col).innerHTML = turno;
            for (var i = 0; i < 3; i++) {
                if (matriz[i][0] != "" && matriz[i][0] == matriz[i][1] && matriz[i][1] == matriz[i][2]) {
                    document.getElementById("mensaje").innerHTML = "gano " + nombreActual;
                    document.getElementById("turnoTexto").innerHTML = "";
                    terminado = true;
                    return;
                }
            }
            for (var j = 0; j < 3; j++) {
                if (matriz[0][j] != "" && matriz[0][j] == matriz[1][j] && matriz[1][j] == matriz[2][j]) {
                    document.getElementById("mensaje").innerHTML = "gano " + nombreActual;
                    document.getElementById("turnoTexto").innerHTML = "";
                    terminado = true;
                    return;
                }
            }
            if (matriz[0][0] != "" && matriz[0][0] == matriz[1][1] && matriz[1][1] == matriz[2][2]) {
                document.getElementById("mensaje").innerHTML = "gano " + nombreActual;
                document.getElementById("turnoTexto").innerHTML = "";
                terminado = true;
                return;
            }
            if (matriz[0][2] != "" && matriz[0][2] == matriz[1][1] && matriz[1][1] == matriz[2][0]) {
                document.getElementById("mensaje").innerHTML = "gano " + nombreActual;
                document.getElementById("turnoTexto").innerHTML = "";
                terminado = true;
                return;
            }
            var llenas = 0;
            for (var i = 0; i < 3; i++) {
                for (var j = 0; j < 3; j++) {
                    if (matriz[i][j] != "") {
                        llenas = llenas + 1;
                    }
                }
            }
            if (llenas == 9) {
                document.getElementById("mensaje").innerHTML = "empate";
                document.getElementById("turnoTexto").innerHTML = "";
                terminado = true;
                return;
            }
            if (turno == "X") {
                turno = "O";
                document.getElementById("turnoTexto").innerHTML = "turno: " + j2;
            } else {
                turno = "X";
                document.getElementById("turnoTexto").innerHTML = "turno: " + j1;
            }
        }
        function reiniciar() {
            matriz = [
                ["", "", ""],
                ["", "", ""],
                ["", "", ""]
            ];
            turno = "X";
            terminado = false;
            iniciado = false;
            for (var i = 0; i < 3; i++) {
                for (var j = 0; j < 3; j++) {
                    document.getElementById("c" + i + j).innerHTML = '<img src="img/fondo.jpg" class="img-fluid">';
                }
            }
            document.getElementById("turnoTexto").innerHTML = "turno:";
            document.getElementById("mensaje").innerHTML = "";
        }
    </script>
</body>
</html>
