<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego 3 en Raya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    
<body>
    <div class="container">
        <h1>Juego 3 en Linea</h1>
        
        <div>
            <label>
                <img src="img/x.jpg" alt="x" width="50" height="60">
            </label>
            <input type="text" class="nombre" id="Jugador1" placeholder="ejem: luis">
        </div>
        
        <div>
            <label>
                <img src="img/o.jpg" alt="o" width="50" height="60">
            </label>
            <input type="text" class="nombre" id="Jugador2" placeholder="ejem: juan">
        </div>

        <br>
        <button class="testbtn btn btn-primary" onclick="iniciar()">Iniciar Juego</button>
        <br><br>

      
        <p id="turnoTexto">Turno: </p>
        <table class="table table-bordered text-center">
            <tr>
                <td onclick="jugar(0,0)" id="c00" class="p-4"></td>
                <td onclick="jugar(0,1)" id="c01" class="p-4"></td>
                <td onclick="jugar(0,2)" id="c02" class="p-4"></td>
            </tr>

            <tr>
                <td onclick="jugar(1,0)" id="c10" class="p-4"></td>
                <td onclick="jugar(1,1)" id="c11" class="p-4"></td>
                <td onclick="jugar(1,2)" id="c12" class="p-4"></td>
            </tr>

            <tr>
                <td onclick="jugar(2,0)" id="c20" class="p-4"></td>
                <td onclick="jugar(2,1)" id="c21" class="p-4"></td>
                <td onclick="jugar(2,2)" id="c22" class="p-4"></td>
            </tr>
        </table>
    </div>

    <script>
        var matriz = [
            ["", "", ""],
            ["", "", ""],
            ["", "", ""]
        ];

        var turno = "X";
        var iniciado = false;
        var terminado = false;

        function iniciar() {
            var j1 = document.getElementById("Jugador1").value;
            var j2 = document.getElementById("Jugador2").value;

            if (j1 == "" || j2 == "") {
                alert("Faltan los nombres de los jugadores");
                return;
            }

            iniciado = true;
            turno = "X"; 
            document.getElementById("turnoTexto").innerHTML = "Le toca el turno a: " + j1 + " (X)";
            document.getElementById("mensaje").innerHTML = "Juego iniciado";
        }

        function jugar(fila, col) {
            if (iniciado == false || terminado == true) {
                return;
            }

            if (matriz[fila][col] != "") {
                return;
            }

            var j1 = document.getElementById("Jugador1").value;
            var j2 = document.getElementById("Jugador2").value;
            var nombreActual = "";

            if (turno == "X") {
                nombreActual = j1;
            } else {
                nombreActual = j2;
            }

          
            matriz[fila][col] = turno;
            document.getElementById("c" + fila + col).innerHTML = turno;

      
            for (var i = 0; i < 3; i++) {
                if (matriz[i][0] != "" && matriz[i][0] == matriz[i][1] && matriz[i][1] == matriz[i][2]) {
                    document.getElementById("mensaje").innerHTML = "Ganó " + nombreActual;
                    document.getElementById("turnoTexto").innerHTML = "Juego terminado";
                    terminado = true;
                    return;
                }
            }

         
            for (var j = 0; j < 3; j++) {
                if (matriz[0][j] != "" && matriz[0][j] == matriz[1][j] && matriz[1][j] == matriz[2][j]) {
                    document.getElementById("mensaje").innerHTML = "Ganó " + nombreActual;
                    document.getElementById("turnoTexto").innerHTML = "Juego terminado";
                    terminado = true;
                    return;
                }
            }

         
            if (matriz[0][0] != "" && matriz[0][0] == matriz[1][1] && matriz[1][1] == matriz[2][2]) {
                document.getElementById("mensaje").innerHTML = "Ganó " + nombreActual;
                document.getElementById("turnoTexto").innerHTML = "Juego terminado";
                terminado = true;
                return;
            }

            if (matriz[0][2] != "" && matriz[0][2] == matriz[1][1] && matriz[1][1] == matriz[2][0]) {
                document.getElementById("mensaje").innerHTML = "Ganó " + nombreActual;
                document.getElementById("turnoTexto").innerHTML = "Juego terminado";
                terminado = true;
                return;
            }

       
            var llenas = 0;
            for (var i = 0; i < 3; i++) {
                for (var j = 0; j < 3; j++) {
                    if (matriz[i][j] != "") {
                        llenas = llenas + 1;
                    }
                }
            }

            if (llenas == 9) {
                document.getElementById("mensaje").innerHTML = "Empate";
                document.getElementById("turnoTexto").innerHTML = "Juego terminado";
                terminado = true;
                return;
            }

      
            if (turno == "X") {
                turno = "O";
                document.getElementById("turnoTexto").innerHTML = "Le toca el turno a: " + j2 + " (O)";
            } else {
                turno = "X";
                document.getElementById("turnoTexto").innerHTML = "Le toca el turno a: " + j1 + " (X)";
            }
        }

        function reiniciar() {
            matriz = [
                ["", "", ""],
                ["", "", ""],
                ["", "", ""]
            ];
            turno = "X";
            terminado = false;
            iniciado = false;

            for (var i = 0; i < 3; i++) {
                for (var j = 0; j < 3; j++) {
                    document.getElementById("c" + i + j).innerHTML = "";
                }
            }

            document.getElementById("turnoTexto").innerHTML = "Le toca el turno a: ---";
            document.getElementById("mensaje").innerHTML = "ponga los nombres y dale a Iniciar Juego";
        }
    </script>
</body>
</html>
